server {
    listen 80;
    server_name deligenx.ai www.deligenx.ai;

    # Allow Certbot to authenticate via HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name deligenx.ai www.deligenx.ai;

    # Dummy SSL certificates for initial startup (replaced by Certbot later)
    # Ensure these paths exist, otherwise Nginx will fail to start. 
    # A script (init-letsencrypt.sh) usually handles the first certificate generation.
    ssl_certificate /etc/letsencrypt/live/deligenx.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/deligenx.ai/privkey.pem;

    # Recommended Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Route frontend traffic to Next.js
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Route backend traffic to FastAPI
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
